[package]
name = "payload-extract"
version = "0.1.1"
edition = "2024"
rust-version = "1.97.1"
description = "Android OTA payload.bin extractor"
license = "GPL-2.0"
keywords = ["android", "ota", "payload", "extraction"]
categories = ["command-line-utilities", "compression"]

[[bin]]
name = "payload-extract"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", default-features = false, features = ["derive", "color", "std", "help", "usage", "error-context"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Protobuf
prost = "0.14"

# Compression
zstd = { version = "0.14", default-features = false, features = ["thin"] }
xz2 = "0.1"
bzip2 = "0.6"
lz4_flex = { version = "0.14", default-features = false, features = ["alloc"] }

# Binary diff (Android BSDF2 format support for BROTLI_BSDIFF)
bsdiff-android = "0.0.2"

# Hashing
sha2 = { version = "0.11", default-features = false }

# ZIP support
zip = { version = "9", default-features = false }

# Terminal styling
console = "0.16"

# Utilities
hex = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"

# Concurrency
rayon = "1"

# Memory-mapped I/O
memmap2 = "0.9"

# Progress
indicatif = { version = "0.18", default-features = false, features = ["rayon"] }

# Async HTTP (feature-gated)
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["stream"], optional = true }
futures = { version = "0.3", default-features = false, features = ["std"], optional = true }
tempfile = { version = "3", optional = true }
webpki-root-certs = { version = "1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"

[features]
default = ["http-native-tls"]
http = ["dep:tokio", "dep:reqwest", "dep:futures", "dep:tempfile"]
http-native-tls = ["http", "reqwest?/native-tls"]
http-rustls = ["http", "dep:webpki-root-certs", "dep:rustls", "reqwest?/rustls-no-provider"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
